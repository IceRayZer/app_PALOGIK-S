<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Racines — arbre généalogique</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2b2a26;--mut:#7a7467;--line:#c9bfa8;--acc:#3f7d58;--accink:#fff;--F:#f6d3dc;--M:#cfe0f3;--X:#dcebcf;--sh:0 2px 10px #0002}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a17;--card:#26241f;--ink:#efe9da;--mut:#a39c8b;--line:#4a463b;--acc:#6fbf8b;--accink:#10210f;--F:#5a3a44;--M:#34495f;--X:#44563a}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{filter:brightness(.95)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.lnk{border:0;background:none;color:var(--mut);text-decoration:underline}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font-size:16px}
h1,h2,h3,h4{margin:.6em 0 .3em}
.mut,small{color:var(--mut)}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);order:0;position:relative}
.logo{cursor:pointer;font-size:18px;white-space:nowrap}.tname{color:var(--mut);flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sp{flex:1}
header button{padding:7px 11px;white-space:nowrap}
#nv{display:flex;gap:4px;padding:4px 10px;border-bottom:1px solid var(--line);order:1}
#nv:empty{display:none}
#nv button{display:flex;align-items:center;gap:6px}#nv button.on{background:var(--ink);color:var(--bg)}
#nv .ic{font-size:16px}
#bn{order:2}#mn{order:3}
.banner{background:#ffe9a8;color:#4a3b00;padding:6px 12px;display:flex;gap:10px;align-items:center;font-size:14px}.banner span{flex:1}
.mw{position:relative}
#mnu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;z-index:8;min-width:210px;flex-direction:column;gap:2px}
#mnu.open{display:flex}#mnu button{border:0;text-align:left;background:none;padding:11px 12px;font-size:15px}#mnu small{padding:6px 12px}
.badge{background:#e5484d;color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:3px}
@media(max-width:760px){
 .lb{display:none}
 header button{padding:9px 12px;font-size:17px}
 #nv{order:5;border-top:1px solid var(--line);border-bottom:0;padding:0 0 env(safe-area-inset-bottom);gap:0;background:var(--card)}
 #nv button{flex:1;flex-direction:column;gap:1px;border:0;border-radius:0;background:none;padding:7px 2px;font-size:11px}
 #nv button.on{background:none;color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
 #nv .ic{font-size:22px}
 .banner{font-size:12.5px;padding:5px 10px}
}
main{flex:1;display:flex;min-height:0;position:relative}
#vw{flex:1;min-width:0}
#vw.st{position:relative;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
#vw.scroll,.scroll{overflow:auto;padding:16px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.lines{position:absolute;left:0;top:0;overflow:visible;stroke:var(--line);fill:none;stroke-width:2}
.lines text{fill:var(--acc);stroke:none;font-size:14px}
.zc{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.zc button{width:46px;height:46px;font-size:20px;padding:0;border-radius:12px;box-shadow:var(--sh)}
.tk{display:flex;border:1px solid var(--line);border-radius:18px;background:var(--card);margin:10px 0;overflow:hidden;box-shadow:var(--sh)}
.tk-main{flex:1;min-width:0;padding:10px 12px;cursor:pointer}.tk-meta{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:8px;display:inline-block;padding:2px 8px;margin-bottom:8px}
.tk-person{display:flex;gap:10px;align-items:center}.tk-person b{display:block}
.tk-btns{display:flex;flex-direction:column;width:72px;border-left:1px solid var(--line)}
.tk-btns button{flex:1;font-size:28px;border:0;border-radius:0;min-height:56px}.tk-btns .ok{background:#2e9e5b33;border-bottom:1px solid var(--line)}.tk-btns .no{background:#e5484d33}
.dr{border-radius:8px;padding:6px 8px;margin:6px 0;font-size:14px;overflow-wrap:anywhere}.dr b{display:block;font-size:12px;color:var(--mut)}
.d-add{background:rgba(255,120,200,.32)}.d-mod{background:rgba(255,150,40,.38)}.d-del{background:rgba(220,20,20,.30)}
.legend .d-add,.legend .d-mod,.legend .d-del{display:inline-block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp figure{margin:0;text-align:center}.cmp figcaption{font-size:12px;color:var(--mut)}.dr .cmp .thumb{width:100%;max-width:150px;height:auto;aspect-ratio:1}
.dr s{opacity:.8}.dr .thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;vertical-align:middle}.dr audio{width:100%;margin:2px 0}
.legend span{display:inline-block;padding:1px 8px;border-radius:8px;margin-right:6px;font-size:12px}
.card{position:absolute;height:78px;display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:2px solid var(--line);box-shadow:var(--sh);cursor:pointer}
.card.F{background:var(--F)}.card.M{background:var(--M)}.card.X{background:var(--X)}
.card.sel{border-color:var(--acc);outline:3px solid var(--acc)}
.card .ct{min-width:0;display:flex;flex-direction:column}.card b{overflow-wrap:anywhere;line-height:1.2;font-size:14px}
.tag{position:absolute;top:-17px;left:6px;font:600 11px system-ui;color:#fff;padding:1px 7px;border-radius:6px 6px 0 0;font-style:normal;white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;background:#8883 center/cover;display:grid;place-items:center;flex:none;font-weight:700}
.av.lg{width:90px;height:90px;font-size:32px;margin:auto}
.grid{display:flex;flex-wrap:wrap;gap:12px}.grid .card{position:static}
#pop{z-index:5}
.fiche blockquote{margin:8px 0;padding:8px 10px;border-left:3px solid var(--acc);background:#8881;white-space:pre-wrap}
.fiche{text-align:center}.fiche>*{text-align:left}.fiche .ph{text-align:center}
.bigph{display:block;margin:6px auto;max-width:100%;max-height:42vh;border-radius:14px;object-fit:contain}
.fiche audio{width:100%}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;margin:3px;background:var(--card)}
.chip.on{background:var(--acc);color:var(--accink)}
.chips{max-height:130px;overflow:auto}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
svg .F{fill:var(--F)}svg .M{fill:var(--M)}svg .X{fill:var(--X)}svg .N{fill:var(--card)}
.sec{stroke:var(--bg);stroke-width:2;cursor:pointer}.sec.empty{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.tx{fill:var(--ink);font-size:12px;pointer-events:none}
.bar{stroke:var(--line);cursor:pointer}.bar.est{stroke-dasharray:4 3;fill-opacity:.5}.bar.sel{stroke:var(--acc);stroke-width:3}
.axis{stroke:var(--line);stroke-width:1;opacity:.5}
.tiles{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:150px;display:flex;flex-direction:column}.tile b{font-size:20px;font-weight:600}
.home{max-width:720px;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tcard{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.tcard div{flex:1}
.empty-st{display:grid;place-items:center;height:100%;text-align:center;padding:20px}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:10;padding:12px}
.wz{background:var(--card);width:min(520px,100%);border-radius:18px;padding:20px 22px;box-shadow:0 10px 40px #0006;max-height:96vh;max-height:96dvh;overflow:auto;animation:pop .25s}
.wz.shake{animation:shake .35s}
.wt{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}
.x{border:0;background:none;font-size:16px}
.dots{text-align:center;margin:8px 0}.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin:0 3px;cursor:pointer;transition:.2s}
.dots i.on{background:var(--acc);transform:scale(1.5)}.dots i.done{background:var(--acc);opacity:.5}
.big{font-size:46px;text-align:center;animation:bob 2.4s ease-in-out infinite}
.wz h2{text-align:center;margin:.2em 0}.hint{text-align:center;color:var(--mut);margin:.2em 0 1em;font-size:13px}
.react{text-align:center;min-height:1.4em;color:var(--acc);font-weight:600}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}
.opts{display:flex;gap:10px}.opt{flex:1;padding:16px 8px;font-size:18px}.opt.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.body input+input,.body input+br+br{margin-top:8px}
.code{font:700 22px monospace;letter-spacing:3px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40;animation:pop .2s;max-width:90vw}
.cf{position:fixed;font-size:24px;pointer-events:none;z-index:30;animation:cf 1.2s ease-out forwards}
/* pop-up de bienvenue : feuille du bas sur mobile, carte centrée sur grand écran */
.wl{place-items:end center;padding:0}
.wl .wz{width:min(480px,100%);border-radius:28px 28px 0 0;padding:22px 20px calc(18px + env(safe-area-inset-bottom));text-align:center;animation:wlup .35s cubic-bezier(.2,.8,.2,1)}
@media(min-width:600px){.wl{place-items:center;padding:12px}.wl .wz{border-radius:28px}}
.wl-hero{width:104px;height:104px;margin:2px auto 6px;border-radius:50%;display:grid;place-items:center;font-size:58px;background:var(--bg);background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.wl-hero span{animation:bob 2.4s ease-in-out infinite}
.wl h2{font-size:26px;line-height:1.15;margin:.3em 0 .15em}
.wl-sub{font-size:16px;color:var(--mut);margin:0 0 14px}
.wl-chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px;padding:0}
.wl-chips li{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;font-weight:600;font-size:14px;background:var(--bg);background:color-mix(in srgb,var(--acc) 12%,var(--card));animation:wlup .4s both}
.wl-chips li:nth-child(2){animation-delay:.08s}.wl-chips li:nth-child(3){animation-delay:.16s}
.wl-chips i{font-style:normal;font-size:17px}
.wl-go{display:block;width:100%;min-height:54px;margin:2px 0 14px;border:0;border-radius:16px;background:var(--acc);color:var(--accink);font-size:17px;font-weight:800;letter-spacing:.3px;box-shadow:0 4px 0 #0003;transition:transform .08s,box-shadow .08s}
.wl-go:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.wl-go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wl-note{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:14px;background:var(--bg);font-size:12.5px;line-height:1.35;color:var(--mut)}
.wl-note i{font-style:normal;font-size:18px;line-height:1.2}.wl-note p{margin:0}
.wl-tip{background:#ffe9a8;color:#4a3b00;font-size:13.5px;margin-bottom:14px}.wl-tip b{font-weight:700}
.wz.red{border:3px solid #c0392b}.wz.red>p:first-child{color:#8e1b10;font-weight:600}
.imp-btns{display:grid;gap:8px}.imp-btns button{padding:12px;border-radius:12px;font-weight:700}
.imp-btns .danger{border-color:#c0392b;color:#c0392b}
.av{position:relative}.mdot{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:11px;line-height:1;background:var(--card);border:1px solid var(--line);border-radius:50%;padding:2px}.av.lg .mdot{font-size:16px}
.mmiss{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0;padding:8px 10px;border-radius:12px;background:#ffe9a8;color:#4a3b00;font-size:13.5px}
@keyframes wlup{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.wl .wz,.wl-chips li,.wl-hero span{animation:none}}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}

.wv{inset:0 0 auto 0;height:100vh;height:100dvh;padding:0;place-items:end center}
.wz2{padding:0;display:flex;flex-direction:column;height:min(620px,100%);max-height:100%;width:min(560px,100%);border-radius:18px 18px 0 0;overflow:hidden}
@media(min-width:761px){.wv{place-items:center;padding:12px}.wz2{border-radius:18px;height:min(640px,100%)}}
.wh{padding:8px 10px 4px;border-bottom:1px solid var(--line);flex:none}
.wb{flex:1;min-height:0;overflow:auto;padding:6px 16px 10px;overscroll-behavior:contain}
.wz2 .nav{flex:none;margin:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.wz2 .nav button{min-height:48px;padding:0 16px}.wz2 .nav button[data-w=fin]{flex:1}
.rail{display:flex;gap:2px;overflow-x:auto}
.ri{flex:1;min-width:44px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;border-radius:12px;background:none;padding:2px;position:relative;opacity:.7}
.ri-i{font-size:20px;line-height:1.1}.ri-l{font-size:10px;line-height:1.1}
.ri.on{opacity:1;background:#3f7d5826;box-shadow:inset 0 0 0 2px var(--acc)}
.ri.ok,.ri.bad{opacity:1}
.ri.ok::after,.ri.bad::after{position:absolute;top:1px;right:3px;width:15px;height:15px;border-radius:50%;font-size:10px;font-weight:700;display:grid;place-items:center;color:#fff}
.ri.ok::after{content:'✓';background:var(--acc);color:var(--accink)}.ri.bad::after{content:'!';background:#e5484d}
.wz2 h2{font-size:18px}.wz2 .big{font-size:34px}
.kb .big,.kb .hint,.kb .react{display:none}.kb .wz2 h2{font-size:16px;margin:.2em 0}
.opts.g3 .opt{padding:12px 4px;font-size:15px}
.body>input,.body>.dtw,.body>.opts{margin-bottom:8px}
.dtw{display:flex;gap:6px;position:relative}.dtw .cal{width:48px;flex:none}
.dtn{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.fr{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.fr>div{flex:1;min-width:0}
.eb{flex:none;width:44px;height:44px;padding:0;border-radius:12px;font-size:16px}.ph h2 .eb{width:38px;height:38px}
.miss{margin:8px 0}.eb2{margin:3px;border-style:dashed;min-height:44px}
</style>

<body>
<header id="hd"></header><nav id="nv"></nav><div id="bn"></div><main id="mn"></main>
<input type="file" id="imp" hidden accept=".zip,application/zip,application/x-zip-compressed">
<script>
'use strict';
/* ---------- utilitaires ---------- */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const now=()=>Date.now();
const pick=(a,not)=>{let x;do x=a[Math.random()*a.length|0];while(x===not&&a.length>1);return x};
const TEST=/\/dev(\/|$)/.test(location.pathname),NS=TEST?'dev-':''; // version de test (/dev/) : stockage et live séparés de la version principale
const LS=(k,v)=>{k=NS+k;try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{}};
const safeC=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#888888';
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\W+/g,'-').toLowerCase()||'arbre';
function toast(m,label,fn){const t=el(`<div class=toast>${esc(m)}</div>`);if(fn){const b=el(`<button style="margin-left:10px">${esc(label)}</button>`);b.onclick=()=>{fn();t.remove()};t.append(b)}document.body.append(t);setTimeout(()=>t.remove(),fn?7000:3200)}
function boom(){for(let i=0;i<18;i++){const s=el(`<span class=cf style="left:50%;top:50%;--dx:${(Math.random()-.5)*600}px;--dy:${(Math.random()-.7)*500}px">${pick(['🌿','🍃','✨','🌳','💚','🍂'])}</span>`);document.body.append(s);setTimeout(()=>s.remove(),1300)}}

/* ---------- stockage local (IndexedDB) : rien ne quitte l'appareil ---------- */
const DB=new Promise((ok,ko)=>{const r=indexedDB.open(NS+'racines',3);r.onupgradeneeded=()=>{const d=r.result;for(const [n,k] of [['trees','id'],['media','id'],['parts','k']])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:k})};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const tx=async(m,f,st='trees')=>{const d=await DB;return new Promise((ok,ko)=>{const t=d.transaction(st,m);const rq=f(t.objectStore(st));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>ko(t.error)})};
// ponytail: l'arbre entier est réécrit à chaque sauvegarde; séparer les personnes en store dédié si les arbres deviennent énormes
const saveTree=t=>tx('readwrite',s=>s.put(t)),allTrees=()=>tx('readonly',s=>s.getAll()),dropTree=id=>tx('readwrite',s=>s.delete(id));

/* ---------- médias : un fichier à part, identifié par l'empreinte SHA-256 de son contenu (même contenu = même identifiant) ---------- */
const MK=['photo','voice'],MC=new Map(); // MC : id -> {type,url}, copie en mémoire pour l'affichage immédiat ; ponytail: tout est chargé au démarrage, à faire à l'ouverture de l'arbre si les médias deviennent très nombreux
const mu=id=>(MC.get(id)||{}).url||(typeof id==='string'&&id.startsWith('data:')?id:''),blobUrl=mu; // ancien format (média dans la fiche) affiché tel quel tant qu'il n'est pas migré
const mkUrl=(buf,type)=>URL.createObjectURL(new Blob([buf],{type}));
async function loadMedia(){for(const m of await tx('readonly',s=>s.getAll(),'media'))MC.set(m.id,{type:m.type,url:mkUrl(m.data,m.type)})}
async function putBytes(id,b,type){if(MC.has(id))return id; // déjà sur l'appareil : ni relu ni réécrit
 const data=b.slice().buffer;await tx('readwrite',s=>s.put({id,type,data}),'media');MC.set(id,{type,url:mkUrl(data,type)});return id}
async function putMedia(blob){const b=new Uint8Array(await blob.arrayBuffer());return putBytes(await sha(b),b,blob.type)}
const delMedia=async id=>{await tx('readwrite',s=>s.delete(id),'media');URL.revokeObjectURL(mu(id));MC.delete(id)};
const refs=t=>{const r=new Set();for(const p of [...Object.values(t.persons||{}),...(t.tickets||[]).map(x=>x.after)])if(p)for(const k of MK)if(p[k])r.add(p[k]);return r};
async function gc(){if(live.peer||T)return; // nettoyage : un média qu'aucun arbre ne référence est supprimé, jamais pendant une session live ni tant qu'un arbre est ouvert (annulation possible)
 const ref=new Set();for(const t of await allTrees())refs(t).forEach(x=>ref.add(x));
 for(const id of [...MC.keys()])if(!ref.has(id))await delMedia(id);
 for(const x of await tx('readonly',s=>s.getAll(),'parts'))if(!ref.has(x.id))await tx('readwrite',s=>s.delete(x.k),'parts')}
const okData=(k,u)=>k==='photo'?safePhoto(u):safeAudio(u);
async function ingestP(p){for(const k of MK)if(typeof p[k]==='string'&&p[k].startsWith('data:')){const u=okData(k,p[k]);try{p[k]=u?await putMedia(await(await fetch(u)).blob()):''}catch{p[k]=''}}return p} // média reçu en ligne (live) ou ancien format -> rangé à part
const sendP=(p,by=ME.name)=>send({t:'p',p,by}); // les médias ne voyagent jamais avec la fiche : l'autre appareil les demande (voir getMedia)
async function migrate(){ // ancien stockage (médias intégrés aux fiches) -> médias à part ; sans risque : les médias sont écrits avant la fiche, et on peut relancer

 const put=async r=>{const x={k:id+'/'+r.i,id,i:r.i,n:r.n,type:r.type,d:r.d.buffer.slice(r.d.byteOffset,r.d.byteOffset+r.d.byteLength)};await tx('readwrite',s=>s.put(x),'parts');have.set(r.i,x)},

const CH=78,GP=26,GX=28,GY=60;
const mctx=document.createElement('canvas').getContext('2d');mctx.font='600 14px system-ui,sans-serif';

const peersOn=id=>Object.entries(live.peers).filter(([k,v])=>k!==myKey()&&v.sel===id).map(([,v])=>v);

function layout(){
 const ps=P(),U={},units=[];
 for(const p of ps){if(U[p.id])continue;const q=get(p.partner),m=q&&!U[q.id]?[p,q]:[p],u={m,k:[]};m.forEach(x=>U[x.id]=u);units.push(u)}
 for(const u of units){u.m.sort((a,b)=>(b.parents.length>0)-(a.parents.length>0));
  outer:for(const x of u.m)for(const pid of x.parents){const pu=U[pid];if(pu&&pu!==u){pu.k.push(u);u.par=pu;break outer}}}
 units.forEach(u=>u.k.sort((a,b)=>(a.m[0].birth||'9').localeCompare(b.m[0].birth||'9')));
 const meas=u=>{u.cws=u.m.map(cw);u.w=u.cws.reduce((a,b)=>a+b)+(u.m.length-1)*GP;u.k.forEach(meas);u.kw=u.k.reduce((a,k)=>a+k.sw,0)+Math.max(0,u.k.length-1)*GX;u.sw=Math.max(u.w,u.kw)};
 const place=(u,x,d)=>{u.x=x+(u.sw-u.w)/2;u.y=d*(CH+GY);let c=x+(u.sw-u.kw)/2;u.k.forEach(k=>{place(k,c,d+1);c+=k.sw+GX})};
 let X=0,W=0,H=0;const roots=units.filter(u=>!u.par);
 roots.forEach(u=>{meas(u);place(u,X,0);X+=u.sw+GX*2});
 let svg='',cards='';
 for(const u of units){if(u.x===undefined)continue;W=Math.max(W,u.x+u.w);H=Math.max(H,u.y+CH);
  let ox=u.x;u.m.forEach((p,i)=>{cards+=card(p,`left:${ox}px;top:${u.y}px`);ox+=u.cws[i]+GP});
  const ym=u.y+CH/2,e0=u.x+u.cws[0];if(u.m.length>1)svg+=`<path d="M${e0} ${ym}H${e0+GP}"/><text x="${e0+GP/2}" y="${ym+5}" text-anchor="middle">♥</text>`;
  if(u.k.length){const px=u.m.length>1?e0+GP/2:u.x+u.w/2,y0=u.m.length>1?ym+8:u.y+CH,my=u.y+CH+GY/2;svg+=`<path d="M${px} ${y0}V${my}"/>`;
   for(const k of u.k)svg+=`<path d="M${px} ${my}H${k.x+k.cws[0]/2}V${k.y}"/>`}}
 return{svg,cards,W:W+40,H:H+40}}

let cam=null,lay={W:1,H:1},moved=false;
const camApply=()=>{const w=$('#world');if(w)w.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`};
const zoomAt=(mx,my,f)=>{const k=Math.min(3,Math.max(.08,cam.k*f));cam.x=mx-(mx-cam.x)*k/cam.k;cam.y=my-(my-cam.y)*k/cam.k;cam.k=k;camApply()};
function camInit(){const st=$('#vw');if(!$('#world'))return;
 if(!cam){const sw=st.clientWidth,sh=st.clientHeight,k=Math.max(.12,Math.min(1,(sw-40)/lay.W,(sh-80)/lay.H));cam={k,x:Math.max(20,(sw-lay.W*k)/2),y:40}}
 camApply();if(st._b)return;st._b=1; // listeners posés une seule fois par élément
 const ptr=new Map();let d=null,pin=0;
 st.onpointerdown=e=>{moved=false;if(e.target.closest('.zc'))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1)d={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};else if(ptr.size===2){d=null;const [a,b]=[...ptr.values()];pin=Math.hypot(a.x-b.x,a.y-b.y)}};
 st.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2&&pin){moved=true;const [a,b]=[...ptr.values()],dist=Math.hypot(a.x-b.x,a.y-b.y),r=st.getBoundingClientRect(); // pincement : zoom autour du centre des deux doigts
   zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,dist/pin);pin=dist;return}
  if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;cam.x=d.cx+dx;cam.y=d.cy+dy;camApply()};
 const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pin=0;if(ptr.size===1){const q=[...ptr.values()][0];d={x:q.x,y:q.y,cx:cam.x,cy:cam.y}}else if(!ptr.size)d=null};
 st.onpointerup=st.onpointercancel=up;
 st.addEventListener('click',e=>{if(moved){e.stopPropagation();moved=false}},true);
 st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.1:1/1.1)},{passive:false})}

function fanView(){

 const pt=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
 const arc=(r0,r1,a0,a1)=>{const [x0,y0]=pt(r1,a0),[x1,y1]=pt(r1,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0);return`M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`};

  const p=S[g+'-'+i],a0=Math.PI+i*Math.PI/2**g,a1=a0+Math.PI/2**g,r0=R0+(g-1)*RW,r1=r0+RW,m=(a0+a1)/2,[x,y]=pt((r0+r1)/2,m),child=S[(g-1)+'-'+(i>>1)];

function timeView(){
 const Y=new Date().getFullYear();
 const rows=P().map(p=>{let b=yr(p.birth),d=p.alive===false?yr(p.death):Y,est=false;if(!b&&d&&p.alive===false)b=d-70,est=true;if(b&&!d)d=b+70,est=true;return b?{p,b,d:Math.max(d,b+1),est}:null}).filter(Boolean).sort((a,b)=>a.b-b.b);
 if(!rows.length)return'<p class=mut>Ajoute des dates de naissance pour voir la frise.</p>';
 const min=Math.floor(Math.min(...rows.map(r=>r.b))/10)*10,max=Math.ceil(Math.max(...rows.map(r=>r.d))/10)*10,ppy=Math.max(3,Math.min(10,800/(max-min))),X=y=>(y-min)*ppy+10,W=X(max)+260,H=rows.length*28+50,step=max-min>150?50:max-min>60?10:5;
 let o='';for(let y=min;y<=max;y+=step)o+=`<line class=axis x1=${X(y)} x2=${X(y)} y1=28 y2=${H}/><text class=tx x=${X(y)} y=18 text-anchor=middle>${y}</text>`;
 rows.forEach((r,i)=>{const y=40+i*28;o+=`<rect class="bar ${r.p.gender||'N'} ${r.est?'est':''} ${sel===r.p.id?'sel':''}" x=${X(r.b)} y=${y} width=${(r.d-r.b)*ppy} height=18 rx=9 data-act=select data-id="${r.p.id}"/><text class=tx x=${X(r.d)+6} y=${y+13}>${esc(nm(r.p))} · ${r.b}–${r.p.alive===false?r.d:''}</text>`});
 const n=P().length-rows.length;
 return`<div style="overflow:auto"><svg width=${W} height=${H}>${o}</svg></div>${n?`<p class=mut>${n} personne(s) sans date de naissance non affichée(s).</p>`:''}<p class=mut>Barres en pointillés : dates estimées.</p>`}

function gens(){const g={};const f=p=>{if(g[p.id]!==undefined)return g[p.id];g[p.id]=0;const ps=p.parents.map(get).filter(Boolean);let v=0;
 if(ps.length)v=Math.max(...ps.map(f))+1;else{const q=get(p.partner),qp=q?q.parents.map(get).filter(Boolean):[];if(qp.length)v=Math.max(...qp.map(f))+1}return g[p.id]=v};P().forEach(f);return g}
function genView(){const g=gens(),by={};P().forEach(p=>(by[g[p.id]]??=[]).push(p));
 return`<input id=flt placeholder="🔎 Filtrer par nom…" style="max-width:320px">`+Object.keys(by).sort((a,b)=>a-b).map(k=>`<h3>Génération ${+k+1} <small>(${by[k].length})</small></h3><div class=grid>${by[k].sort((a,b)=>(a.birth||'9').localeCompare(b.birth||'9')).map(p=>card(p)).join('')}</div>`).join('')}

function statsView(){const ps=P(),g=gens(),Y=new Date().getFullYear();
 const by=ps.map(p=>yr(p.birth)).filter(Boolean),ages=ps.filter(p=>p.alive===false&&yr(p.birth)&&yr(p.death)).map(p=>yr(p.death)-yr(p.birth));
 const top=(a,n=3)=>Object.entries(a.filter(Boolean).reduce((o,x)=>(o[x]=(o[x]||0)+1,o),{})).sort((x,y)=>y[1]-x[1]).slice(0,n).map(([k,v])=>`${esc(k)} <small>×${v}</small>`).join(', ')||'—';
 const t0=new Date();t0.setHours(0,0,0,0);
 const bd=ps.filter(p=>p.alive!==false&&p.birth.length===10).map(p=>{const [y,m,d]=p.birth.split('-').map(Number);let n=new Date(Y,m-1,d);if(n<t0)n=new Date(Y+1,m-1,d);return{p,days:Math.round((n-t0)/864e5),age:n.getFullYear()-y}}).sort((a,b)=>a.days-b.days).slice(0,5);

 return`<div class=tiles>${tile('Personnes',ps.length)}${tile('Vivant·e·s',ps.filter(p=>p.alive!==false).length)}${tile('Générations',Math.max(...Object.values(g))+1)}${tile('Plus ancienne naissance',by.length?Math.min(...by):'—')}${tile('Âge moyen au décès',ages.length?Math.round(ages.reduce((a,b)=>a+b)/ages.length)+' ans':'—')}</div>
 <div class=tiles>${tile('Prénoms fréquents',top(ps.map(p=>p.first.split(' ')[0])))}${tile('Noms fréquents',top(ps.map(p=>p.last)))}${tile('Lieux de naissance',top(ps.map(p=>p.birthPlace)))}</div>
 <h3>🎂 Prochains anniversaires</h3>${bd.length?bd.map(x=>`<div><span class=chip data-act=select data-id="${x.p.id}">${esc(nm(x.p))}</span> ${x.days?`dans ${x.days} j`:'<b>aujourd’hui !</b>'} — ${x.age} ans</div>`).join(''):'<small>Ajoute des dates de naissance complètes.</small>'}`}

const FL={first:'Prénom(s)',last:'Nom',maiden:'Nom de jeune fille',gender:'Genre',birth:'Naissance',birthPlace:'Lieu de naissance',alive:'Statut',death:'Décès',deathPlace:'Lieu de décès',job:'Métier',story:'Anecdote',photo:'Photo',voice:'Vocal',parents:'Parents',partner:'Conjoint·e'};

const rawF=(p,k)=>!p?'':k==='parents'?p.parents.join():k==='alive'?(p.alive===false?'d':'v'):(p[k]||'');
const showF=(p,k)=>{const nmOf=id=>{const q=get(id);return q?nm(q):'(fiche inconnue)'};
 return k==='parents'?p.parents.map(nmOf).join(' & '):k==='partner'?(p.partner?nmOf(p.partner):''):k==='alive'?(p.alive===false?'Décédé(e)':'Vivant(e)'):k==='gender'?GL[p.gender]||'':k==='birth'||k==='death'?fmt(p[k]):p[k]||''};
function diffRows(t){const b=get(t.pid),a=t.after,rows=[];
 for(const k in FL){const ov=rawF(b,k),nv=rawF(a,k);if(ov===nv||(!b&&k==='alive'&&nv==='v'))continue;
  const kind=!ov||(!b&&k==='alive')?'add':!nv?'del':'mod'; // rose = ajouté, orange = modifié, rouge = supprimé

  const html=kind==='add'?cell(a,'new'):kind==='del'?`<s>${cell(b,'old')}</s>`:k==='voice'?cell(b,'old')+cell(a,'new'):k==='photo'?`<div class=cmp><figure><figcaption>Avant</figcaption>${cell(b,'old')}</figure><figure><figcaption>Proposé</figcaption>${cell(a,'new')}</figure></div>`:`${cell(b,'old')} → ${cell(a,'new')}`;
  rows.push(`<div class="dr d-${kind}"><b>${FL[k]}</b>${html}</div>`)}
 return rows}

/* ---------- export : un ZIP unique (arbre.json + un dossier par personne + LISEZ-MOI.txt) ---------- */
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){ // files:[[chemin,Uint8Array]] ; stockage sans compression (photos et sons sont déjà compressés) ; ponytail: pas de ZIP64, plafond 4 Go / 65535 fichiers
 const enc=new TextEncoder(),d=new Date(),dt=(d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate(),tm=d.getHours()<<11|d.getMinutes()<<5|d.getSeconds()>>1,parts=[],cen=[];let off=0;
 for(const [n,b] of files){const nb=enc.encode(n),c=crc32(b),h=new DataView(new ArrayBuffer(30)),g=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,c,true);h.setUint32(18,b.length,true);h.setUint32(22,b.length,true);h.setUint16(26,nb.length,true);
  g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x800,true);g.setUint16(12,tm,true);g.setUint16(14,dt,true);g.setUint32(16,c,true);g.setUint32(20,b.length,true);g.setUint32(24,b.length,true);g.setUint16(28,nb.length,true);g.setUint32(42,off,true);
  parts.push(h,nb,b);cen.push(g,nb);off+=30+nb.length+b.length}
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cen.reduce((s,x)=>s+x.byteLength,0),true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e],{type:'application/zip'})}
const fname=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-+|-+$/g,'')||'Sans-nom';
const EXT={'image/jpeg':'jpg','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/mpeg':'mp3','audio/ogg':'ogg','audio/webm':'webm'};
const fileExt=mime=>EXT[mime.split(';')[0]]||(mime.split(';')[0].split('/')[1]||'bin').replace(/\+.*/,'');
const personBase=p=>`${fname(`${p.first} ${p.last}`)}_${/^\d{4}/.test(p.birth)?p.birth.slice(0,4):'sans-date'}`; // Prenom-Nom_annee

Arbre : ${t.name}
Exporte le : ${day}

Ce fichier ZIP contient tout l'arbre : les donnees ET les medias (photos, vocaux).

CONTENU
- arbre.json : toutes les donnees de l'arbre (personnes, liens de parente, dates, lieux, anecdotes).
- Un dossier par personne, nomme "Prenom-Nom_anneeDeNaissance", qui contient ses medias.
  Les fichiers sont nommes "Prenom-Nom_annee_type_date.extension" :
  type = photo ou vocal ; date = derniere modification de la fiche.
- Chaque media n'existe qu'une seule fois dans le ZIP.

REIMPORTER L'ARBRE
Dans Racines, bouton Importer, puis choisir ce fichier ZIP tel quel (sans le decompresser).

RETROUVER LES FICHIERS A LA MAIN
Decompresse le ZIP (ordinateur, ou application Fichiers du telephone) et ouvre les dossiers.

STRUCTURE DE arbre.json
{ "app": "racines", "v": 2, "tree": { "id", "name", "family", "origin", "author", "about", "updated", "persons": { "<id>": { ... } } }, "media": { "<empreinte>": { "file", "type", "size" } } }
Chaque personne : id, first (prenom), last (nom), maiden (nom de jeune fille), gender (genre),
birth et death (AAAA, AAAA-MM ou AAAA-MM-JJ), birthPlace, deathPlace, alive (true/false),
job (metier), story (anecdote), storyQ (question de l'anecdote), parents (0 a 2 identifiants),
partner (identifiant), del (true si supprimee), u (derniere modification, en millisecondes),
photo et voice (identifiant du media ; vide s'il n'y en a pas).
Formats : photos en JPEG (1280 pixels au maximum), sons en AAC .m4a mono 48 kbit/s (WebM/Opus si le navigateur ne sait pas enregistrer en AAC).
Un media est identifie par l'empreinte SHA-256 de son contenu (64 caracteres hexadecimaux).
La table "media" donne, pour chaque empreinte, le chemin du fichier dans ce ZIP (file), son type (type) et sa taille en octets (size).
Un fichier renomme ou deplace dans le ZIP reste reconnu : Racines retrouve un media grace a son contenu, jamais a son nom.
ATTENTION : si tu modifies un media hors de Racines (recadrage, retouche, simple reenregistrement), son empreinte change et il ne sera plus reconnu a l'import. Pour changer un media, passe par Racines.
Ces informations suffisent pour reconstruire un arbre dans n'importe quel outil, meme si Racines ne fonctionne plus.
`;

async function readZip(buf){ // -> Map chemin→Uint8Array ; fichiers stockés ou deflate ; l'intégrité se vérifie par l'empreinte SHA-256 des médias
 const v=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder(),out=new Map();let e=u8.length-22,tot=0;
 while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
 const n=v.getUint16(e+10,true);let c=v.getUint32(e+16,true);
 for(let i=0;i<n;i++){if(v.getUint32(c,true)!==0x02014b50)throw new Error('zip');
  const meth=v.getUint16(c+10,true),cs=v.getUint32(c+20,true),us=v.getUint32(c+24,true),nl=v.getUint16(c+28,true),xl=v.getUint16(c+30,true),cl=v.getUint16(c+32,true),lo=v.getUint32(c+42,true),name=dec.decode(u8.subarray(c+46,c+46+nl));
  c+=46+nl+xl+cl;if(name.endsWith('/'))continue;
  if((tot+=us)>1e9)throw new Error('zip trop gros'); // garde-fou contre une archive piégée
  const s=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let d=u8.subarray(s,s+cs);
  if(meth===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else if(meth!==0)throw new Error('zip');
  out.set(name,d)}
 return out}

async function importDiff(l,o,byId){ // ce que l'import va changer sur l'arbre l ; mêmes règles que mergeTree : la fiche la plus récente gagne, rien n'est retiré. Chaque photo/vocal compte pour 1 média.
 const d={add:0,upd:0,del:0,newer:0,gone:0,only:0,ma:0,mm:0,mr:0,info:o.tree.mu>l.mu};
 for(const [id,p] of Object.entries(o.tree.persons)){const lp=l.persons[id];
  if(lp&&p.u<lp.u){lp.del&&!p.del?d.gone++:d.newer++;continue}
  if(lp&&p.u===lp.u||!lp&&p.del)continue;
  d[!lp||lp.del&&!p.del?'add':p.del?'del':'upd']++;
  for(const k of MK){if(p[k]&&!byId.has(p[k])&&!MC.has(p[k]))continue; // média absent du fichier et de l'appareil : celui de l'appareil est gardé
   const x=lp&&lp[k]||'',y=p[k]||'';if(x!==y)d[!x?'ma':!y?'mr':'mm']++}}
 for(const [id,p] of Object.entries(l.persons))if(!p.del&&!(id in o.tree.persons))d.only++;
 return d}

 for(const p of ps)for(const k of MK){const id=p[k];if(!id)continue;
  if(byId.has(id))await putBytes(id,byId.get(id),String((meta[id]||{}).type||''));
  else if(!MC.has(id))p[k]=keep&&l&&l.persons[p.id]&&l.persons[p.id][k]||''}}

const COLORS=['#e4572e','#17bebb','#d9a600','#76b041','#a05195','#ff7f50'];
const ME={name:LS('racines.me')||'',color:COLORS[Math.random()*6|0]};
const PV=3; // version du protocole live (3 : les médias se récupèrent par morceaux) : un hôte et un invité de versions différentes ne se mélangent pas
const pend=()=>{try{return JSON.parse(LS('racines.pend.'+(T?T.id:''))||'[]')}catch{return[]}},setPend=a=>T&&LS('racines.pend.'+T.id,JSON.stringify([...new Set(a)])); // fiches envoyées par cet invité, en attente de validation
const live={peer:null,conns:[],host:false,code:'',peers:{},sent:0,dids:{},quiet:false};
const DID=LS('racines.id')||(()=>{const v=rid()+rid();LS('racines.id',v);return v})(); // identité de cet appareil
const reg=()=>{try{return JSON.parse(LS('racines.reg.'+T.id)||'{}')}catch{return{}}}, saveReg=R=>LS('racines.reg.'+T.id,JSON.stringify(R)); // appareils connus de l'hôte : {id:{name,role}}
function kick(key){if(!live.host||key==='host'||!live.peers[key])return;const c=live.conns.find(x=>x.peer===key),did=live.dids[key];
 if(did){const R=reg();delete R[did];saveReg(R)}
 delete live.peers[key];delete live.dids[key];live.conns=live.conns.filter(x=>x!==c);
 if(c){c.send({t:'kicked'});setTimeout(()=>c.close(),300)}bcastPeers();liveUI();render()}
const doKick=key=>{const v=live.peers[key];if(!v||!confirm(`Retirer ${v.name} de la session ? Il pourra la rejoindre à nouveau avec le lien (une nouvelle validation sera demandée).`))return;live.host?kick(key):send({t:'kick',to:key})};
const RK={guest:0,editor:1,creator:2},ROLE_LABEL={guest:'👁️ Invité',editor:'✏️ Éditeur',creator:'👑 Créateur'};
// hors session ou hôte = Créateur ; invité connecté = rôle attribué par l'hôte (Invité tant qu'il n'est pas reçu)
const myRole=()=>!live.peer||live.host?'creator':(live.peers[myKey()]||{}).role in RK?live.peers[myKey()].role:'guest';
const rank=()=>RK[myRole()];
const rankOf=c=>RK[(live.peers[c.peer]||{}).role]??0;
let liveOv=null;
const send=(m,except)=>{for(const c of live.conns)if(c!==except&&c.open)c.send(m)};
const bcastPeers=()=>send({t:'peers',peers:live.peers});
function presence(){if(!live.peer)return;if(live.host){live.peers.host.sel=sel;bcastPeers()}else send({t:'sel',id:sel})}
const loadPeer=()=>window.Peer?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=()=>ko(new Error('PeerJS indisponible (hors-ligne ?)'));document.head.append(s)});
async function hostStart(custom,tries=0){await loadPeer();const code=custom||Math.random().toString(36).slice(2,8).toUpperCase(),peer=new Peer(NS+'racines-'+code);
 Object.assign(live,{peer,host:true,code,peers:{host:{name:ME.name,color:ME.color,sel,role:'creator'}}});
 peer.on('open',()=>{LS('racines.code.'+T.id,code);liveUI();render()}); // le code est mémorisé : même code = même lien à la prochaine session
 peer.on('error',e=>{if(e.type!=='unavailable-id'){toast('Live : '+e.type);leave();return}
  peer.destroy();live.peer=null;
  if(!custom)hostStart();
  else if(tries<4){toast('Code encore occupé (ancienne session ?), nouvelle tentative…');setTimeout(()=>hostStart(custom,tries+1),3000)}
  else{toast('Ce code est déjà utilisé par quelqu’un d’autre : choisis-en un autre');leave()}});
 peer.on('connection',c=>{c.on('data',m=>onMsg(m,c));c.on('close',()=>{live.conns=live.conns.filter(x=>x!==c);if(live.peers[c.peer]){toast(`👋 ${live.peers[c.peer].name} est parti·e`);delete live.peers[c.peer];delete live.dids[c.peer];bcastPeers();liveUI();render()}})})}
async function joinStart(code,name,quiet){await loadPeer();ME.name=name;LS('racines.me',name);LS('racines.sess',code);const peer=new Peer();Object.assign(live,{peer,host:false,code,sent:0,peers:{},quiet:!!quiet});
 peer.on('open',()=>{const c=peer.connect(NS+'racines-'+code,{reliable:true});live.conns=[c];
  c.on('open',()=>{c.send({t:'hi',pv:PV,me:{name:ME.name,color:ME.color,sel,id:DID}});if(!live.quiet)toast('⏳ En attente de l’acceptation de l’hôte…')});
  c.on('data',m=>onMsg(m,c));c.on('close',()=>{if(live.peer){toast('Session terminée — ta copie reste sur cet appareil');leave()}})});
 peer.on('error',e=>{if(!live.quiet)toast(e.type==='peer-unavailable'?'Code introuvable : l’hôte est-il connecté ?':'Connexion impossible ('+e.type+')');leave()})}
function leave(){dl.q=[];dl.all=false;if(live.peer)live.peer.destroy();LS('racines.sess','');Object.assign(live,{peer:null,conns:[],host:false,code:'',peers:{},sent:0,dids:{},quiet:false});liveUI();render();gc()}
async function onMsg(m,c){if(!m||typeof m.t!=='string')return;
 if(live.host&&m.t!=='hi'&&!live.conns.includes(c))return;
 switch(m.t){
 case'hi':{if(!live.host||live.conns.includes(c)||!m.me)return;const me={name:String(m.me.name||'Invité').slice(0,30),color:safeC(m.me.color)};
  if((m.pv||1)<PV){c.send({t:'old'});setTimeout(()=>c.close(),400);toast(`${me.name} utilise une ancienne version de l’appli : il doit recharger sa page (Ctrl+F5)`);return}
  const did=String(m.me.id||'').slice(0,40),R=reg(),known=did&&R[did]; // appareil déjà venu : accepté d'office avec son rôle
  if(!known&&!confirm(`${me.name} demande à rejoindre la session et recevra une copie de « ${T.name} » (en tant qu’Invité : lecture seule, tu pourras changer son rôle ensuite). Accepter ?`)){c.close();return}
  if(did)for(const [k,d] of Object.entries(live.dids))if(d===did){const old=live.conns.find(x=>x.peer===k);live.conns=live.conns.filter(x=>x!==old);delete live.peers[k];delete live.dids[k];if(old)old.close()} // même appareil qui revient : on remplace l'ancienne connexion
  live.conns.push(c);live.peers[c.peer]={...me,role:known&&known.role in RK?known.role:'guest'};
  if(did){live.dids[c.peer]=did;R[did]={name:me.name,role:live.peers[c.peer].role};saveReg(R)}c.send({t:'tree',pv:PV,tree:wire(T)});c.send({t:'pend',pids:(T.tickets||[]).filter(x=>did&&x.did===did).map(x=>x.pid)});bcastPeers();liveUI();render();toast(`👋 ${me.name} a rejoint`);pullFrom(c,needIds());break}
 case'old':{if(!live.host){toast('Ta version de l’appli est trop ancienne : recharge la page (Ctrl+F5) puis rejoins à nouveau');leave()}break}
 case'pend':{if(!live.host&&T)setPend([...(m.pids||[]).filter(x=>typeof x==='string'),...(live.sentPids||[])]);render();break}
 case'tkres':{if(live.host||!T)return;setPend(pend().filter(x=>x!==m.pid));live.sentPids=(live.sentPids||[]).filter(x=>x!==m.pid);const q=get(m.pid);toast(m.ok?`✅ Ta modification de « ${q?nm(q):'une fiche'} » a été validée`:`❌ Ta modification de « ${q?nm(q):'une fiche'} » a été refusée`);render();break}
 case'tree':{if(live.host)return;if((m.pv||1)<PV){toast('L’hôte utilise une ancienne version : il doit recharger sa page (Ctrl+F5) pour que les tickets fonctionnent');leave();return} // l'hôte ne reçoit jamais d'arbre complet : les ajouts d'un invité arrivent sous forme de tickets
  for(const p of Object.values(m.tree&&m.tree.persons||{}))if(p&&typeof p==='object')await ingestP(p);const r=norm(m.tree),l=T&&T.id===r.id?T:(await allTrees()).find(x=>x.id===r.id),items=l?proposals(l,r):[];
  if(l&&!live.quiet)await saveTree({...l,id:l.id+'-av-'+now().toString(36),name:l.name+' (avant session)',su:undefined,tickets:[]}); // copie de sécurité de l'arbre personnel, dans tous les cas (sauf reprise après rechargement : la session est déjà la même)
  r.su=Object.fromEntries(Object.entries(r.persons).map(([k,p])=>[k,p.u]));if(l&&l.lastExport)r.lastExport=l.lastExport;
  T=r;hist=[];view='tree';cam=null;sel=null;await saveTree(T);
  live.sentPids=items.map(i=>i.after.id);if(items.length)setPend([...pend(),...live.sentPids]);
  for(const it of items)c.send({t:'prop',item:it});
  if(items.length)toast(`🎫 ${items.length} de tes modification(s) hors-ligne ont été envoyées à l’hôte pour validation. Ta version précédente est gardée dans « Mes arbres ».`);
  render();arrivalMedia();break}
 case'prop':{if(!live.host||!live.conns.includes(c)||!m.item||!m.item.after||!m.item.after.id)return;
  const after=normP(await ingestP({...m.item.after})),did=live.dids[c.peer]||'',who=(live.peers[c.peer]||{}).name||'?';
  T.tickets=(T.tickets||[]).filter(x=>!(did&&x.did===did&&x.pid===after.id)); // un seul ticket par appareil et par fiche
  T.tickets.push({id:rid(),who,did,at:now(),pid:after.id,after});saveTree(T);toast(`🎫 ${who} propose une modification`);render();ticketsUI();break}
 case'p':{if(!T||!m.p||!m.p.id||(live.host&&rankOf(c)<1))return;const p=normP(await ingestP({...m.p}));if(!T)return;const l=T.persons[p.id];if(!l||p.u>l.u){T.persons[p.id]=p;(T.su=T.su||{})[p.id]=p.u;T.updated=Math.max(T.updated,p.u);saveTree(T);if(m.by)toast(`✏️ ${String(m.by).slice(0,30)} a modifié ${nm(p)}`)}if(live.host){send(m,c);pullFrom(c,[p.photo,p.voice])}render();break}
 case'm':{if(!T||!m.m||(live.host&&rankOf(c)<2))return;const r=norm({...m.m,persons:{}});if(r.mu>T.mu){for(const k of ['name','family','origin','about','author'])T[k]=r[k];T.mu=r.mu;saveTree(T)}if(live.host)send(m,c);render();break}
 case'sel':{if(live.host&&live.peers[c.peer]){live.peers[c.peer].sel=typeof m.id==='string'?m.id:null;bcastPeers();render()}break}
 case'role':{if(live.host&&rankOf(c)>=2)setRole(m.to,m.role);break}
 case'kick':{if(live.host&&rankOf(c)>=2)kick(m.to);break}
 case'kicked':{if(!live.host){toast('Tu as été retiré de la session');leave()}break}
 case'mget':serveMedia(c,m);break
 case'mchunk':case'mgone':gotMedia(c,m);break
 case'peers':{if(!live.host&&m.peers){const b=myRole();live.peers=m.peers;if(myRole()!==b)toast(`Ton rôle : ${ROLE_LABEL[myRole()]}`);liveUI();render()}break}}}
function setRole(key,role){if(!live.host||!live.peers[key]||key==='host'||!(role in RK))return;live.peers[key].role=role;const did=live.dids[key];if(did){const R=reg();if(R[did]){R[did].role=role;saveReg(R)}}bcastPeers();liveUI();render()}
function liveUI(open){
 if(open&&!liveOv){liveOv=el('<div class=ov></div>');document.body.append(liveOv);
  liveOv.addEventListener('change',e=>{const s=e.target.closest('[data-role]');if(!s)return;if(live.host)setRole(s.dataset.role,s.value);else send({t:'role',to:s.dataset.role,role:s.value})});
  liveOv.addEventListener('click',async e=>{const kb=e.target.closest('[data-kick]');if(kb)return doKick(kb.dataset.kick);const b=e.target.closest('[data-l]');if(!b)return;const l=b.dataset.l,nm=()=>($('#lname',liveOv).value||'').trim()||'Anonyme';
   try{if(l==='close'){liveOv.remove();liveOv=null}
   else if(l==='host'){ME.name=nm();LS('racines.me',ME.name);const raw=($('#lhc',liveOv).value||'').trim().toUpperCase();
    if(raw&&!/^[A-Z0-9-]{6,24}$/.test(raw))return toast('Code : 6 à 24 caractères (lettres, chiffres, tiret)');if(await warnHost())await hostStart(raw||undefined)}
   else if(l==='join'){const c=($('#lcode',liveOv).value||'').trim().toUpperCase();if(!c)return toast('Entre le code');if(await warnJoin())await joinStart(c,nm());liveUI()}
   else if(l==='copy'){await navigator.clipboard.writeText(location.href.split('#')[0]+'#join='+live.code);toast('🔗 Lien copié')}
   else if(l==='getall'){dl.fail.clear();dlAdd(needIds(),true);liveUI()}
   else if(l==='leave')await tryLeave()}catch(err){toast(err.message)}})}
 if(!liveOv||!liveOv.isConnected)return;
 const on=!!live.peer,pre=typeof open==='string'?open:'';
 liveOv.innerHTML=`<div class=wz><div class=wt><span>📡 Session live</span><button class=x data-l=close>✕</button></div>`+(on?
  `<p>Ton rôle : <b>${ROLE_LABEL[myRole()]}</b></p>${rank()>=2?`<p>Code invité : <b class=code>${esc(live.code)}</b></p><p><button data-l=copy>🔗 Copier le lien d’invitation</button></p>`:''}<h4>Participants</h4>${Object.entries(live.peers).map(([k,v])=>{const r=v.role in RK?v.role:'guest';return`<div style="display:flex;gap:6px;align-items:center;margin:4px 0"><span class=dot style="background:${safeC(v.color)}"></span><span style="flex:1">${esc(v.name)}${k===myKey()?' (moi)':''}${k==='host'?' · hôte':''}</span>${rank()>=2&&k!=='host'?`<select data-role="${esc(k)}">${Object.entries(ROLE_LABEL).map(([rk,l])=>`<option value=${rk} ${rk===r?'selected':''}>${l}</option>`).join('')}</select>`:`<small>${ROLE_LABEL[r]}</small>`}${rank()>=2&&k!=='host'&&k!==myKey()?`<button class=x data-kick="${esc(k)}" title="Retirer de la session">✕</button>`:''}</div>`}).join('')||'<small>Connexion…</small>'}${mediaPanel()}<p class=hint>Les modifications s’affichent en direct chez tout le monde. Chacun garde sa copie sur son appareil.${live.host?' Si tu quittes, la session s’arrête.':''}</p><button data-l=leave>Quitter la session</button>`
  :`<p class=hint>Édite l’arbre à plusieurs en direct. Les données circulent <b>d’appareil à appareil</b> (WebRTC) — rien n’est envoyé à GitHub. L’hôte valide chaque invité.</p><label>Ton prénom<input id=lname value="${esc(ME.name)}"></label>${T?`<label>Code d’invitation <small>(garde le même code = même lien pour tes proches à chaque session)</small><input id=lhc value="${esc(LS('racines.code.'+T.id)||'')}" placeholder="vide = code aléatoire" style="text-transform:uppercase"></label><p class=hint>6 à 24 caractères (lettres, chiffres, tiret). Choisis-en un difficile à deviner. L’hôte valide de toute façon chaque nouvel appareil.</p><p><button class=pri data-l=host>Héberger « ${esc(T.name)} »</button></p>`:''}<h4>Rejoindre une session</h4><input id=lcode placeholder="Code (ex. K3F9QZ)" value="${esc(pre)}" style="text-transform:uppercase"><p><button data-l=join>Rejoindre</button></p><p class=hint>En rejoignant, tu reçois une copie de l’arbre, stockée uniquement sur ton appareil.</p>`)+'</div>'}

/* ---------- accueil et rappel de sauvegarde ---------- */
function welcome(){const ios=/iP(hone|ad|od)/.test(navigator.userAgent)&&!navigator.standalone; // Safari efface les données d'un site inutilisé 7 jours, sauf appli sur l'écran d'accueil
 const o=el(`<div class="ov wl"><div class=wz role=dialog aria-modal=true aria-labelledby=wlt>
  <div class=wl-hero aria-hidden=true><span>🌳</span></div>
  <h2 id=wlt>Bienvenue dans Racines !</h2>
  <p class=wl-sub>Crée et partage l’histoire de ta famille, simplement.</p>
  <ul class=wl-chips><li><i>🔒</i>Sur ton appareil</li><li><i>👨‍👩‍👧</i>En direct</li><li><i>💾</i>Exportable</li></ul>
  ${ios?'<div class="wl-note wl-tip"><i>📱</i><p><b>Sur iPhone</b>, Safari peut effacer les données d’un site non utilisé pendant 7 jours. Ajoute Racines à ton écran d’accueil : <b>Partager → Sur l’écran d’accueil</b>, et exporte ton arbre régulièrement.</p></div>':''}
  <button class=wl-go>C’est parti !</button>
  <div class=wl-note><i>🕶️</i><p>Si vous êtes en navigation privée, les informations et données ne seront pas sauvegardées. Il est donc préférable d’utiliser un navigateur classique.</p></div>
 </div></div>`);
 o.onclick=e=>{if(e.target===o||e.target.closest('.wl-go'))o.remove()};document.body.append(o);$('.wl-go',o).focus({preventScroll:true})}
// rappel toutes les 10 min, seulement s'il y a des modifications non exportées, jamais pendant une saisie ni sous une fenêtre ouverte ; ne sauvegarde jamais seul
setInterval(()=>{if(!T||!P().length||document.hidden||$('.ov')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||(T.lastExport&&T.updated<=T.lastExport))return;bnHide=false;render()},6e5);

/* ---------- démarrage ---------- */
(async()=>{if(TEST){document.title='[TEST] '+document.title;document.body.style.paddingTop='28px';document.body.prepend(el('<div style="position:fixed;top:0;left:0;right:0;z-index:50;background:#d93025;color:#fff;font:700 13px system-ui;text-align:center;padding:5px">VERSION TEST — données séparées de Racines</div>'))}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
 try{await loadMedia();await migrate()}catch(e){console.error(e);toast('Mise à jour du stockage impossible : '+e.message)}
 HOME=await allTrees();render();gc();
 const m=location.hash.match(/join=([A-Za-z0-9]+)/);
 if(m){history.replaceState(null,'',location.pathname+location.search);const code=m[1].toUpperCase();
  if(ME.name)warnJoin().then(ok=>ok&&joinStart(code,ME.name)).catch(e=>toast(e.message)); // appareil déjà venu : on entre directement, sans formulaire
  else liveUI(code)}
 else{const s=LS('racines.sess');if(s&&ME.name)joinStart(s,ME.name,true).catch(()=>{})} // rechargement : on reprend la session en cours
 welcome()
})();
</script>
